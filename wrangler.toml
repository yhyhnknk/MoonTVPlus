# 🚀 修正：删除了 pages_build_output_dir 这一行，彻底转为 Workers 架构
name = "moontv-plus"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"
minify = true

# 静态资源配置
# Cloudflare Workers Assets 用于服务静态文件
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "moontvplus"
# ✅ 修正：把之前打包报错中拿到的真实账户下的数据库 ID 贴在这里，或者确保由 GitHub 流水线脚本动态替换
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[vars]
NODE_ENV = "production"
BUILD_TARGET = "cloudflare"
